# GitHub Actions CI/CD for Walls Cave Survey Software
# Requires Windows runner with Visual Studio

name: Build Walls

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
          - Release_XP
          - Debug_XP
      platform:
        description: "Build platform"
        required: true
        default: "x86"
        type: choice
        options:
          - x86
          - x64

env:
  SOLUTION_PATH: Walls32/Walls.sln
  WALLSMAP_SOLUTION_PATH: WallsMap/WallsMap.sln

jobs:
  # ==============================================================================
  # WALLS32 BUILD
  # ==============================================================================
  build-walls:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
        platform: [x86]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MFC to Visual Studio
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart -Wait

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NASM
        run: nasm --version

      - name: Install OpenGL headers
        run: |
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkDirs = Get-ChildItem -Path $sdkPath -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($sdkDirs) {
            $glPath = "$($sdkDirs.FullName)\um\gl"
            $khrPath = "$($sdkDirs.FullName)\um\KHR"

            if (-not (Test-Path $glPath)) {
              New-Item -ItemType Directory -Force -Path $glPath | Out-Null
            }
            if (-not (Test-Path $khrPath)) {
              New-Item -ItemType Directory -Force -Path $khrPath | Out-Null
            }

            Write-Host "Copying OpenGL headers to $glPath"
            Copy-Item -Path "inc\glext.h" -Destination "$glPath\glext.h"
            Copy-Item -Path "inc\wglext.h" -Destination "$glPath\wglext.h"
            Copy-Item -Path "inc\khrplatform.h" -Destination "$khrPath\khrplatform.h"
          }

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_PATH }}
        continue-on-error: true

      - name: Build Walls32
        run: |
          msbuild ${{ env.SOLUTION_PATH }} `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walls-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            Walls32/bin/*.exe
            Walls32/bin/*.dll
          retention-days: 7
