# GitHub Actions CI/CD for Walls Cave Survey Software
# Requires Windows runner with Visual Studio

name: Build Walls

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      platform:
        description: "Build platform"
        required: true
        default: "x86"
        type: choice
        options:
          - x86
          - x64

env:
  SOLUTION_PATH: Walls32/Walls.sln
  WALLSMAP_SOLUTION_PATH: WallsMap/WallsMap.sln

jobs:
  # ==============================================================================
  # WALLS32 BUILD
  # ==============================================================================
  build-walls:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
        platform: [x86]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[17.0]"

      - name: Install Visual Studio Components
        run: |
          $requiredComps = @(
            "Microsoft.VisualStudio.Component.Windows10SDK",
            "Microsoft.VisualStudio.Component.VC.ATL",
            "Microsoft.VisualStudio.Component.VC.ATL.Spectre",
            "Microsoft.VisualStudio.Component.VC.ATLMFC",
            "Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre",
            "Microsoft.Component.VC.Runtime.UCRTSDK"
          )
          [string]$requiresArgs = $requiredComps | ForEach-Object {" -requires " +  $_}
          [string]$addArgs = $requiredComps | ForEach-Object {" --add " +  $_}
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe noto found at $vswhere.  Cannot locate Visual Studio"
            exit 1
          }
          $vsinstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $vsinstaller)) {
            Write-Error "vswhere.exe noto found at $vswhere.  Cannot locate Visual Studio"
            exit 1
          }
          $installed = & $vswhere -products * $requiresArgs -property installationPath -latest
          if ($installed) {
            Write-Host "Required components already installed in Visual Studio at: $installed"
            exit 0
          }

          $vsInstall = & $vswhere -products * -requires Microsoft.Component.MSBuild -property installationPath -latest
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath $vsInstall $addArgs --includeRecommended --quiet --norestart --wait
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Error "vs_installer modify exited with code $code"
            exit $code
          }

          $installed = & $vswhere -products * $requiresArgs -property installationPath -latest
          if ($installed) {
            Write-Host "Visual Studio components installed successfully."
            exit 0
          } else {
            Write-Error "Visual Studio components installation failed (vswhere did not find component)."
            exit 2
          }

      - name: List MFC key file directory
        run: |
          dir C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC
          dir C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207
          dir C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\atlmfc
          dir C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\atlmfc\lib
          dir C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\atlmfc\lib\x86

      - name: List all Visual Studio installations
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -products *  -include packages -format json

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NASM
        run: nasm --version

      - name: Install OpenGL headers
        run: |
          $sdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $sdkDirs = Get-ChildItem -Path $sdkPath -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($sdkDirs) {
            $glPath = "$($sdkDirs.FullName)\um\gl"
            $khrPath = "$($sdkDirs.FullName)\um\KHR"

            if (-not (Test-Path $glPath)) {
              New-Item -ItemType Directory -Force -Path $glPath | Out-Null
            }
            if (-not (Test-Path $khrPath)) {
              New-Item -ItemType Directory -Force -Path $khrPath | Out-Null
            }

            Write-Host "Copying OpenGL headers to $glPath"
            Copy-Item -Path "inc\glext.h" -Destination "$glPath\glext.h"
            Copy-Item -Path "inc\wglext.h" -Destination "$glPath\wglext.h"
            Copy-Item -Path "inc\khrplatform.h" -Destination "$khrPath\khrplatform.h"
          }

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_PATH }}
        continue-on-error: true

      - name: Build Walls32
        run: |
          msbuild ${{ env.SOLUTION_PATH }} `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /bl:walls.binlog `
            /m

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walls.binlog
          path: walls.binlog

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walls-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            Walls32/bin/*.exe
            Walls32/bin/*.dll
          retention-days: 7
