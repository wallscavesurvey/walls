# GitHub Actions CI/CD for Walls Cave Survey Software
# Requires Windows runner with Visual Studio

name: Build Walls

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      platform:
        description: "Build platform"
        required: true
        default: "x86"
        type: choice
        options:
          - x86
          - x64

env:
  SOLUTION_PATH: Walls32/Walls.sln
  WALLSMAP_SOLUTION_PATH: WallsMap/WallsMap.sln

jobs:
  # ==============================================================================
  # WALLS32 BUILD
  # ==============================================================================
  build-walls:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Release]
        platform: [x86]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Install Help+Manual
      #   run: |
      #     Invoke-WebRequest -Uri "https://www.helpandmanual.com/download/hm7setup.exe" -OutFile "hm7setup.exe"
      #     .\hm7setup.exe /SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=helpman.log
      #     dir "${env:ProgramFiles}"
      #     dir "${env:ProgramFiles(x86)}"
      #     dir "${env:ProgramFiles(x86)}\EC Software"
      #     dir "${env:ProgramFiles(x86)}\EC Software\HelpAndManual7"
      #     echo "${env:ProgramFiles(x86)}\EC Software\HelpAndManual7" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # - name: Upload Help+Manual install log
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: helpman.log
      #     path: helpman.log
      #     retention-days: 1

      # - name: Register Help+Manual
      #   run: |
      #     echo $env:path
      #     HELPMAN.EXE /lic:${{ secrets.HELP_AND_MANUAL_LICENSE }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # - name: Setup NuGet
      #   uses: nuget/setup-nuget@v2

      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NASM
        run: nasm --version

      # - name: Restore NuGet packages
      #   run: nuget restore ${{ env.SOLUTION_PATH }}
      #   continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node build deps
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Get Build Version
        run: |
          corepack enable
          pnpm exec semantic-release --dry-run

      - name: Build Walls32
        id: msbuild
        run: |
          try {
            $versionStr = (Get-Content -Path ".\.version" -Raw -ErrorAction Stop).Trim()
          } catch {
            $versionStr = '1.0.0'
          }

          if ($versionStr -match '^\d+\.\d+\.\d+') {
            $version = [version]"${Matches[0]}.0"
            Write-Host "Successfully parsed version $versionStr into environment variables."
          } else {
            Write-Error "Error: File content '$versionStr' does not match expected X.Y.Z format."
            $version = [version]'1.0.0.0'
          }

          msbuild ${{ env.SOLUTION_PATH }} `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /p:WALLS_VER_MAJOR=$version.Major `
            /p:WALLS_VER_MINOR=$version.Minor `
            /p:WALLS_VER_PATCH=$version.Build `
            /p:WALLS_VER_BUILD=$version.Revision `
            /p:WALLS_BUILD_DATE=$(Get-Date -Format 'yyyy-MM-dd') `
            /bl:walls.binlog `
            /m

      - name: Upload Build Log if Failed
        if: steps.msbuild.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: walls.binlog
          path: walls.binlog
          retention-days: 7

      - name: Build Walls Installer
        run: |
          try {
            $version = (Get-Content -Path ".\.version" -Raw -ErrorAction Stop).Trim()
          } catch {
            $version = '1.0.0'
          }
          if ($version -match '^\d+\.\d+\.\d+') {
            $version = $Matches[0]
          }
          (Get-Content '.\WallsInstaller\WallsInstaller.vdproj') -replace '"ProductVersion" = "8:2.0.0"', "`"ProductVersion`" = `"8:$version`"" | Set-Content '.\WallsInstaller\WallsInstaller.vdproj'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installDir = & $vswhere -latest -property installationPath
          $devenv = Join-Path $installDir "Common7\IDE\devenv.com"
          & $devenv Walls32\Walls.sln /build "Release|x86" /project "WallsInstaller"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walls-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            bin/WallsInstaller.msi
          retention-days: 7

      - name: semantic-release
        run: |
          corepack enable
          pnpm exec semantic-release
